plugins { id 'com.android.application' }

// Inject the deployed /exec URL through GitHub Actions, not source control.
def defaultServerUrl = (System.getenv('OBSHCHAK_SCRIPT_URL') ?: '').trim()
if (defaultServerUrl && !(defaultServerUrl.startsWith('https://script.google.com/macros/s/') && defaultServerUrl.endsWith('/exec'))) {
    throw new GradleException('OBSHCHAK_SCRIPT_URL must be a Google Apps Script /exec URL')
}
android {
    namespace 'ua.obshchak.mobile'
    compileSdk 35
    defaultConfig { applicationId 'ua.obshchak.mobile'; minSdk 26; targetSdk 34; versionCode 5; versionName '3.2-test'; buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + defaultServerUrl + '"' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.work:work-runtime:2.12.0'
}