<html lang="uk">

<title>ОБЩАК — спільна каса</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#122437;background:#eef3f6;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}
#root{min-height:100vh}.layout{max-width:1060px;margin:0 auto;padding:18px 20px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.logo{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2px;font-size:23px}.logo-icon{display:grid;place-items:center;background:#0c746c;color:white;width:39px;height:39px;border-radius:12px}.muted{color:#678090}.tiny{font-size:12px;color:#6c8190}.small{font-size:13px}.card{background:#fff;border:1px solid #dbe5ea;border-radius:19px;padding:18px;box-shadow:0 4px 19px #1e394607}.card + .card{margin-top:14px}.headrow,.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.align-top{align-items:flex-start}.gap8{gap:8px}.stack{display:grid;gap:12px}.stack-sm{display:grid;gap:8px}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:19px}h3{font-size:15px}p{line-height:1.48}.balance{background:linear-gradient(125deg,#0a6764,#053a50);border:0;color:white;padding:24px}.balance .muted{color:#cbefed}.bigmoney{font-weight:850;font-size:clamp(34px,7vw,48px);letter-spacing:-1.2px;margin:8px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.positive{color:#087f61}.negative{color:#bf4e45}.whitepositive{color:#9af0c2}.whitenegative{color:#ffb8a7}.metric{font-weight:750;font-size:22px;margin-top:8px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#e9f1f4;color:#1b4555;font-weight:700;min-height:43px}.btn.primary{background:#087b72;color:#fff}.btn.secondary{background:#e6f3f1;color:#096c62}.btn.danger{background:#fff0ed;color:#9f413d}.btn.outline{border:1px solid #bfd4db;background:white}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.full{width:100%}.btn.sm{min-height:34px;padding:8px 11px;font-size:13px}.tag{display:inline-flex;align-items:center;border-radius:40px;padding:4px 9px;font-size:11px;font-weight:750;background:#edf2f6;color:#43616f}.tag.green{background:#ddf7ed;color:#0a765d}.tag.orange{background:#fff2d9;color:#946009}.tag.red{background:#ffe9e7;color:#a9443f}.line{border-top:1px solid #e7edf1}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 1px;border-bottom:1px solid #edf1f3;cursor:pointer}.rowitem:last-child{border-bottom:0}.rowitem strong{font-size:14px}.right{text-align:right}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.navbtn{border:0;background:transparent;padding:10px 13px;border-radius:11px;color:#637987;font-weight:700;font-size:13px}.navbtn.active{background:#d8efed;color:#056e66}.input,.select,.textarea{width:100%;border:1px solid #c8d9e1;border-radius:11px;padding:12px;background:#fff;color:#102c39;outline:0}.input:focus,.select:focus,.textarea:focus{border-color:#159a8e;box-shadow:0 0 0 3px #0a928517}.textarea{min-height:80px;resize:vertical}label{display:block;color:#4e6674;font-weight:720;font-size:13px;margin-bottom:6px}.field{margin:0 0 14px}.rowform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formwrap{max-width:720px}.seg{display:flex;gap:8px}.seg button{flex:1}.empty{color:#788d9a;padding:20px;text-align:center}.status{padding:10px 12px;border-radius:11px;background:#eef3f5;color:#4f6875;font-size:13px}.warn{background:#fff0d9;color:#8b5917}.error{background:#ffe8e7;color:#9c3935}.divider{height:1px;background:#e4ecef;margin:14px 0}.mono{font-variant-numeric:tabular-nums}.comment{padding:11px 13px;background:#f2f6f7;border-radius:12px;margin:8px 0}.comment.cashier{background:#e8f5f1}.modalback{position:fixed;inset:0;background:#071e35b8;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}.modal{background:white;border-radius:18px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 25px 70px #06202d50}.imageview{max-width:100%;max-height:65vh;object-fit:contain;display:block;margin:auto}.pdfview{width:100%;height:65vh;border:0}.toast{position:fixed;top:15px;right:15px;z-index:40;max-width:min(450px,90vw);padding:14px 18px;background:#102e3b;color:white;border-radius:13px;box-shadow:0 10px 35px #01253638}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(420px,100%)}.userchip{font-size:13px;color:#46626d;display:flex;align-items:center;gap:8px}.badge-dot{width:9px;height:9px;border-radius:50%;background:#13a181;display:inline-block}.clamp{overflow-wrap:anywhere}.sheet-table{overflow:auto}.sheet-table table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}.sheet-table th,.sheet-table td{text-align:left;border-bottom:1px solid #e2e9ed;padding:10px}.sheet-table th{background:#f4f8fa;color:#536c7a}.bottom-nav{display:none}.file-name{font-size:12px;color:#698290;margin-top:6px}
@media(max-width:640px){.layout{padding:13px 13px 100px}.top{margin-bottom:16px}.top .logo{font-size:20px}.nav{display:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d8e6ec;display:grid;grid-template-columns:repeat(5,1fr);z-index:15;padding:5px 3px max(6px,env(safe-area-inset-bottom));box-shadow:0 -3px 15px #102c3911}.bottom-nav button{background:transparent;border:0;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:10px;color:#647e8c;padding:7px 0}.bottom-nav button.active{color:#08776e;font-weight:800}.bottom-nav b{font-size:20px}.rowform{grid-template-columns:1fr}.card{padding:15px;border-radius:15px}.balance{padding:20px}.metric{font-size:19px}h1{font-size:21px}.rowitem{padding:14px 1px}.userchip{font-size:11px}.btn{padding:10px 12px}}
</style>
</head>
<body><div id="root"><div class="login-shell"><p>Завантаження ОБЩАК…</p></div></div><div id="toast-holder"></div>
<script>
'use strict';
function safeGet(k){try{return sessionStorage.getItem(k)||'';}catch(e){return '';}}
function safeSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function safeRemove(k){try{sessionStorage.removeItem(k);}catch(e){}}
const A={token:safeGet('obshchak_token'),state:null,page:'home',kind:'IN',selected:null,preview:null,secret:null,filter:'ALL',reportFrom:'',reportTo:'',loading:false,lastEvent:safeGet('obshchak_event'),error:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s===undefined||s===null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const euro=n=> (Number(n)/100).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴';
const signed=n=>(Number(n)>0?'+':'')+euro(n);
const nameOf=id=>{const x=(A.state?.users||[]).find(u=>u.id===id);return x?x.name:'Користувач'};
const cashier=()=>A.state?.me?.role==='CASHIER';
const admin=()=>['ADMIN','RESERVE'].includes(A.state?.me?.role);
const hasAdministrator=()=>A.state?.users?.some(u=>u.role==='ADMIN'||u.role==='RESERVE');
const stamp=s=>esc(String(s||'').replace(' ',' · '));
function toast(s,bad=false){let holder=$('#toast-holder');holder.innerHTML=`<div class="toast" style="background:${bad?'#a13b3b':'#123847'}">${esc(s)}</div>`;setTimeout(()=>{holder.innerHTML=''},4500);}
function invoke(action,data={}){return new Promise((resolve,reject)=>{if(!window.google||!google.script||!google.script.run){reject(new Error('Відкрийте застосунок за посиланням Google Apps Script, а не локальний HTML-файл.'));return;}
  google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e)))).api(action,data,A.token);
});}
async function request(action,data={},refresh=true){if(A.loading)throw new Error('Дочекайтеся завершення операції');A.loading=true;try{let r=await invoke(action,data);if(refresh)await load(false);return r;}finally{A.loading=false;}}
function dateLocal(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function formatDate(s){if(!s)return'';let v=String(s).slice(0,10).split('-');return v.length===3?v[2]+'.'+v[1]+'.'+v[0]:s;}
function navBtn(id,label,icon){return `<button type="button" class="navbtn ${A.page===id?'active':''}" data-act="page" data-page="${id}">${icon} ${label}</button>`;}
function mobileBtn(id,label,icon){return `<button type="button" class="${A.page===id?'active':''}" data-act="page" data-page="${id}"><b>${icon}</b>${label}</button>`;}
function render(){if(!A.state){renderLogin();return;}
let me=A.state.me, items=[['home','Головна','⌂'],['ledger','Операції','⇄'],['reports','Звіти','▤'],['people','Люди','♟'],['votes','Вибори','✓']];
$('#root').innerHTML=`<div class="layout"><header class="top"><div class="logo"><span class="logo-icon">₴</span>ОБЩАК</div><div class="userchip"><span class="badge-dot"></span><span>${esc(me.name)} <span class="tiny">${esc(me.role==='CASHIER'?'касир':['ADMIN','RESERVE'].includes(me.role)?'адміністратор':'учасник')}</span></span><button class="btn sm outline" data-act="logout">Вийти</button></div></header>
<nav class="nav">${items.map(x=>navBtn(...x)).join('')}${navBtn('reversals','Сторнування','↶')}${navBtn('activity','Активність','◷')}</nav>
<main>${A.page==='home'?home():A.page==='ledger'?ledgerPage():A.page==='reports'?reportsPage():A.page==='people'?peoplePage():A.page==='votes'?votesPage():A.page==='reversals'?reversalsPage():activityPage()}</main>
<div class="tiny" style="text-align:center;margin-top:24px">Дані Google Таблиці · Онлайн-облік, не банківський баланс · <button class="btn sm" data-act="refresh">Оновити</button> <button class="btn sm" data-act="password">Змінити пароль</button></div></div>
<nav class="bottom-nav">${items.map(x=>mobileBtn(...x)).join('')}</nav>
${A.selected?detailModal():''}${A.preview?previewModal():''}${A.secret?secretModal():''}`;
restoreForm();
}
function renderLogin(forceChange=false){
  $('#root').innerHTML=`<div class="login-shell"><div class="login-box stack"><div class="stack-sm" style="text-align:center"><div class="logo" style="justify-content:center"><span class="logo-icon">₴</span>ОБЩАК</div><p class="muted">Прозора каса для своєї компанії</p></div><div class="card"><h2 style="margin-bottom:18px">${forceChange?'Зміна тимчасового пароля':'Вхід до общака'}</h2>${A.error?`<p class="status error" style="margin-bottom:14px">${esc(A.error)}</p>`:''}
${forceChange?`<form id="change-first"><div class="field"><label>Поточний пароль</label><input class="input" type="password" name="old" required></div><div class="field"><label>Новий PIN (4 цифри) або довгий пароль</label><input class="input" type="password" name="fresh" minlength="4" required></div><button class="btn primary full" type="submit">Змінити пароль</button></form>`:
`<form id="login"><div class="field"><label>Логін</label><input class="input" name="login" autocomplete="username" required placeholder="Ваш логін"></div><div class="field"><label>Пароль</label><input class="input" type="password" name="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">Увійти</button></form>`}
</div><p class="tiny" style="text-align:center">Доступ лише за особистими логінами. Не передавайте свої паролі іншим.</p></div></div>`;
}
function home(){const t=A.state.totals, recent=A.state.ledger.slice(0,7), pending=A.state.events.slice(0,4), waiting=(A.state.reversalRequests||[]).filter(r=>r.status==='PENDING'||r.status==='DISPUTED');return `<div class="stack"><div class="card balance"><div class="muted small">ЗАГАЛЬНИЙ ЗАЛИШОК ОБЩАКА</div><div class="bigmoney mono">${euro(t.balance)}</div><div class="muted small">Єдиний обліковий залишок незалежно від способу зберігання.</div></div>
<div class="grid2"><div class="card"><div class="tiny">↙ ПРИХІД</div><div class="metric positive mono">${euro(t.income)}</div></div><div class="card"><div class="tiny">↗ РОЗХІД</div><div class="metric negative mono">${euro(t.expense)}</div></div></div>
${waiting.length?'<div class="card"><div class="headrow"><h2>⚠ Сторнування на розгляді: '+waiting.length+'</h2><button class="btn sm" data-act="page" data-page="reversals">Переглянути</button></div><p class="tiny">До погодження адміністратора загальний залишок не зміниться.</p></div>':''}<div class="card"><div class="headrow"><h2>Останні операції</h2><button class="btn sm" data-act="page" data-page="ledger">Усі →</button></div>${recent.length?recent.map(txRow).join(''):'<div class="empty">Поки немає операцій. Касир може додати перший прихід.</div>'}</div>
<div class="card"><div class="headrow"><h2>Що нового</h2><button class="btn sm" data-act="page" data-page="activity">Історія →</button></div>${pending.length?pending.map(x=>`<div class="rowitem" data-act="event" data-ref="${esc(x.ref_id)}"><div><strong>${esc(x.summary)}</strong><div class="tiny">${stamp(x.created_at)}</div></div></div>`).join(''):'<div class="empty">Подій ще немає.</div>'}</div></div>`;}
function kindName(x){return x==='IN'?'Прихід':x==='OUT'?'Розхід':'Коригування';}
function reversedIds(){return new Set(A.state.ledger.filter(x=>x.kind==='REVERSAL').map(x=>x.correction_of));}
function txRow(x){let rs=A.state.receipts.filter(r=>r.ledger_id===x.id), rev=reversedIds().has(x.id), req=reversalFor(x.id), desc=x.kind==='IN'?(x.person_name||x.purpose):x.purpose;
return `<div class="rowitem" data-act="detail" data-id="${esc(x.id)}"><div><strong>${esc(desc)}</strong><div class="tiny">${formatDate(x.date)} · ${esc(kindName(x.kind))}${x.kind==='OUT'?' · '+esc(x.expense_target||'Без напряму'):''}${rs.length?' · 📎 '+rs.length+' чек':''}${rev?' · Сторновано':''}${req&&req.status!=='APPROVED'?' · ⚠ '+esc(reversalStatus(req.status)):''}</div></div><div class="right"><strong class="mono ${Number(x.amount)>=0?'positive':'negative'}">${signed(x.amount)}</strong><div class="tiny">Переглянути ›</div></div></div>`;}
function ledgerPage(){let data=A.state.ledger.filter(x=>A.filter==='ALL'||x.kind===A.filter);return `<div class="stack">
<div class="headrow"><h1>Прихід і розхід</h1><span class="tag">${A.state.ledger.length} записів</span></div>
${cashier()&&!A.state.ledger.length?`<div class="card"><h2>Початковий залишок</h2><p class="tiny" style="margin:9px 0">Якщо гроші вже є, введіть загальну суму один раз, до першої операції.</p><form id="opening-balance"><div class="field"><label>Сума, грн</label><input class="input" name="amount" inputmode="decimal" placeholder="Напр. 10000,00" required></div><button class="btn secondary" type="submit">Зберегти початковий залишок</button></form></div>`:''}${cashier()?entryForm():''}
<div class="card"><div class="headrow"><h2>Журнал операцій</h2><select class="select" id="filter" style="max-width:158px"><option value="ALL" ${A.filter==='ALL'?'selected':''}>Усі</option><option value="IN" ${A.filter==='IN'?'selected':''}>Прихід</option><option value="OUT" ${A.filter==='OUT'?'selected':''}>Розхід</option><option value="REVERSAL" ${A.filter==='REVERSAL'?'selected':''}>Коригування</option></select></div>
${data.length?data.map(txRow).join(''):'<div class="empty">За цим фільтром записів немає</div>'}</div></div>`;}
function entryForm(){return `<div class="card formwrap stack-sm"><h2>Нова операція</h2><div class="seg"><button type="button" class="btn ${A.kind==='IN'?'primary':''}" data-act="kind" data-kind="IN">＋ Прихід</button><button type="button" class="btn ${A.kind==='OUT'?'primary':''}" data-act="kind" data-kind="OUT">− Розхід</button></div>
<form id="add-transaction"><div class="rowform"><div class="field"><label>Дата</label><input class="input" type="date" name="date" value="${esc(A.state.today||dateLocal())}" required></div><div class="field"><label>Сума, грн</label><input class="input" name="amount" inputmode="decimal" placeholder="Напр. 500,00" required></div></div>
${A.kind==='IN'?`<div class="rowform"><div class="field"><label>Від кого отримано</label><select class="select" name="personId" id="person-select"><option value="OTHER">Інша особа / інше надходження</option>${A.state.users.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div></div><div class="field" id="otherperson"><label>Від кого (якщо не учасник)</label><input class="input" name="personName" value="Інше надходження"></div>`:
`<div class="field"><label>Напрям витрати *</label><select class="select" name="expenseTarget" required><option value="">Оберіть напрям</option><option value="МП">МП</option><option value="ГМЕ 1">ГМЕ 1</option><option value="ГМЕ 2">ГМЕ 2</option></select></div><div class="field"><label>Категорія (можна вписати свою)</label><input class="input" name="category" value="Господарські потреби" required maxlength="80"></div>
<div class="field"><label>Чек (JPG, PNG, WebP або PDF, до 2 МБ)</label><input class="input" type="file" id="receipt-input" name="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div>
<div class="field"><label>Якщо чека немає — причина</label><textarea class="textarea" name="noReceiptReason" placeholder="Наприклад, продавець не видав чек"></textarea></div>`}
<div class="field"><label>Призначення / на що гроші</label><textarea class="textarea" name="purpose" required maxlength="300" placeholder="Наприклад, продукти для спільних потреб"></textarea></div>
<button class="btn primary full" type="submit">Зберегти ${A.kind==='IN'?'прихід':'витрату'}</button></form>
<p class="tiny">Після збереження операцію неможливо змінити або видалити. Помилки виправляються лише сторнуванням.</p></div>`;}
function reversalStatus(status){
  return status==='PENDING'?'Очікує адміністратора':status==='DISPUTED'?'Оскаржено учасником':
    status==='APPROVED'?'Схвалено адміністратором':'Відхилено';
}
function reversalFor(original){
  return (A.state.reversalRequests||[]).find(r=>r.original_id===original&&
    ['PENDING','DISPUTED','APPROVED'].includes(r.status));
}
function reversalsPage(){
  const list=A.state.reversalRequests||[];
  const waiting=list.filter(r=>r.status==='PENDING'||r.status==='DISPUTED').length;
  let html='<div class="stack"><div class="headrow"><h1>Контроль сторнувань</h1><span class="tag">'+
    waiting+' на розгляді</span></div><div class="card"><p class="small">Касир подає заявку; лише адміністратор схвалює її. До схвалення баланс не змінюється. Учасники можуть оскаржити заявку.</p></div>';
  if(!list.length)html+='<div class="card">Заявок немає.</div>';
  for(const r of list){
    const orig=A.state.ledger.find(x=>x.id===r.original_id);
    const pending=r.status==='PENDING',disputed=r.status==='DISPUTED';
    html+='<div class="card"><div class="headrow"><strong>↶ '+
      (orig?esc(orig.purpose):esc(r.original_id.slice(0,8)))+'</strong><span class="tag">'+
      esc(reversalStatus(r.status))+'</span></div>';
    if(orig)html+='<div class="small">'+esc(orig.person_name||'')+' · '+signed(orig.amount)+
      ' · Дата: '+formatDate(orig.date)+' · Внесено: '+stamp(orig.created_at)+'</div>';
    html+='<p class="small">Причина: '+esc(r.reason)+'</p><p class="tiny">Подав: '+
      esc(nameOf(r.requested_by))+' · '+stamp(r.created_at)+'</p>';
    if(r.objection)html+='<p class="status warn">Заперечення від '+
      esc(nameOf(r.objected_by))+': '+esc(r.objection)+'</p>';
    if(r.acknowledged_by)html+='<p class="status">Внескодавець ознайомився: '+
      esc(nameOf(r.acknowledged_by))+'</p>';
    if(r.decided_by)html+='<p class="tiny">Рішення: '+esc(nameOf(r.decided_by))+' · '+
      stamp(r.decided_at)+'</p>';
    if(pending&&orig&&orig.kind==='IN'&&orig.person_id&&orig.person_id===A.state.me.id)
      html+='<button class="btn sm" data-act="reversal-ack" data-id="'+esc(r.id)+'">Ознайомився зі сторнуванням мого внеску</button>';
    if(pending&&r.requested_by!==A.state.me.id)
      html+='<button class="btn sm" data-act="reversal-dispute" data-id="'+esc(r.id)+'">⚠ Заперечити</button>';
    if(admin()&&(pending||disputed)){
      html+='<button class="btn sm danger" data-act="reversal-reject" data-id="'+esc(r.id)+'">Відхилити</button>';
      if(pending)html+='<button class="btn sm primary" data-act="reversal-approve" data-id="'+esc(r.id)+'">✓ Схвалити сторнування</button>';
    }
    html+='</div>';
  }
  return html+'</div>';
}
function detailModal(){const x=A.state.ledger.find(t=>t.id===A.selected);if(!x)return'';

function expenseStatsWeb(periodRows,allRows){

  const originals=new Map(allRows.filter(x=>x.kind==='OUT').map(x=>[x.id,x]));
  const directions=new Map();
  for(const x of periodRows){
    const orig=x.kind==='REVERSAL'?originals.get(x.correction_of):x;
    if(!orig||orig.kind!=='OUT')continue;
    const direction=orig.expense_target||'Без напряму';
    const category=orig.category||'Без категорії';
    if(!directions.has(direction))directions.set(direction,new Map());
    const group=directions.get(direction);
    group.set(category,(group.get(category)||0)-Number(x.amount));
  }
  let html='<details class="card"><summary style="cursor:pointer;font-size:18px;font-weight:750;color:#0b605c">'
    +'▤ Статистика витрат за категоріями ▾</summary>';
  html+='<p class="tiny" style="margin:12px 0">За вибраний період звіту; сторно віднімається від відповідної категорії.</p>';
  if(!directions.size)html+='<p class="empty">Витрат за період немає</p>';
  for(const [direction,groups] of directions){
    let total=0;for(const amount of groups.values())total+=amount;
    html+='<div style="margin:13px 0 6px"><div class="headrow"><b>'+esc(direction)
      +'</b><strong>'+euro(total)+'</strong></div>';
    for(const [category,value] of [...groups.entries()].sort((a,b)=>b[1]-a[1]))
      html+='<div class="rowitem"><span>'+esc(category)+'</span><b>'+euro(value)+'</b></div>';
    html+='</div>';
  }
  return html+'</details>';
}

function restoreForm(){const f=$('#add-transaction');if(!f)return;let d;
  try{d=JSON.parse(localStorage.getItem(draftKey())||'{}');}catch(e){return;}
  f.querySelectorAll('input:not([type=file]),textarea,select').forEach(el=>{if(el.name&&Object.prototype.hasOwnProperty.call(d,el.name))el.value=d[el.name];});
}
document.addEventListener('input',ev=>{if(ev.target.closest('#add-transaction'))rememberForm();});
document.addEventListener('change',ev=>{if(ev.target.closest('#add-transaction'))rememberForm();});
document.addEventListener('submit',async ev=>{
const f=ev.target;if(!f.id)return;ev.preventDefault();let d=fromForm(f);
try{
if(f.id==='login'){let r=await invoke('login',d);A.token=r.token;safeSet('obshchak_token',r.token);A.error='';if(r.mustChange){A.state=null;renderLogin(true);}else await load();return;}
if(f.id==='change-first'||f.id==='change-password'){let r=await invoke('changePassword',d);A.token='';safeRemove('obshchak_token');A.error='Пароль змінено. Увійдіть знову.';A.state=null;renderLogin();return;}
if(f.id==='opening-balance'){await request('openingBalance',d);toast('Початковий залишок записано.');return;}
if(f.id==='handover'){await request('recordHandover',d);toast('Акт передачі зафіксовано.');return;}
if(f.id==='add-transaction'){d.kind=A.kind;let file=f.querySelector('input[type=file]')?.files?.[0];if(d.kind==='OUT')d.receipt=await toData(file);if(d.kind==='IN'&&d.personId==='OTHER')d.personId='';await request('addTransaction',d);try{localStorage.removeItem(draftKey());}catch(e){}toast('Операцію додано.');return;}
if(f.id==='add-receipt'){d.receipt=await toData(f.querySelector('input[type=file]').files[0]);await request('addReceipt',d);toast('Чек додано.');return;}
if(f.id==='add-comment'){await request('comment',d);toast('Коментар додано.');return;}
if(f.id==='reverse'){if(!confirm('Надіслати заявку адміністратору? Залишок поки не зміниться.'))return;await request('reverseTransaction',d);toast('Заявку подано. Баланс не змінено.');return;}
if(f.id==='bootstrap-admin'||f.id==='invite'){let r=await request(f.id==='bootstrap-admin'?'bootstrapAdmin':'invite',d);A.secret={login:r.login,password:r.password};render();return;}
if(f.id==='propose'){await request('proposeElection',d);toast('Ініціативу створено.');return;}
}catch(err){toast(err.message,true);}
});
document.addEventListener('click',async ev=>{let button=ev.target.closest('[data-act]');if(!button)return;if(ev.target.closest('[data-stop]')&&!button.hasAttribute('data-act'))return;let act=button.dataset.act;
try{
if(act==='page'){A.page=button.dataset.page;A.selected=null;render();window.scrollTo(0,0);}
else if(act==='refresh')await load();
else if(act==='kind'){A.kind=button.dataset.kind;render();}
else if(act==='detail'){A.selected=button.dataset.id;render();}
else if(act==='close-detail'){if(ev.target===button || button.tagName==='BUTTON'){A.selected=null;render();}}
else if(act==='reversal-ack'){await handler('ackReversal',{id:button.dataset.id},'Ознайомлення зафіксовано.');}
else if(act==='reversal-dispute'){let reason=prompt('Поясніть заперечення');if(reason===null)return;
  if(reason.trim().length<5)throw new Error('Опишіть причину щонайменше п\'ятьма символами');
  await handler('disputeReversal',{id:button.dataset.id,reason:reason.trim()},'Заперечення видно всім.');}
else if(act==='reversal-reject'){let reason=prompt('Причина відхилення');if(reason===null)return;
  if(!reason.trim())throw new Error('Вкажіть причину');
  await handler('decideReversal',{id:button.dataset.id,decision:'REJECT',reason:reason.trim()},'Відхилено.');}
else if(act==='reversal-approve'){if(!confirm('Підтвердити сторнування зі зміною балансу?'))return;
  let reason=prompt('Коментар адміністратора');if(reason===null)return;
  if(!reason.trim())throw new Error('Вкажіть коментар');
  await handler('decideReversal',{id:button.dataset.id,decision:'APPROVE',reason:reason.trim()},'Сторнування схвалено.');}
else if(act==='receipt'){let r=await invoke('getReceipt',{id:button.dataset.id});A.preview={name:r.name,mime:r.mime,url:saveBlob(r)};render();}
else if(act==='close-preview'){if(ev.target!==button && button.tagName!=='BUTTON')return;if(A.preview?.url)URL.revokeObjectURL(A.preview.url);A.preview=null;render();}
else if(act==='event'){const ref=button.dataset.ref;if(A.state.ledger.some(x=>x.id===ref)){A.selected=ref;render();}else{A.page='activity';render();}}
else if(act==='logout'){await invoke('logout');A.token='';A.state=null;safeRemove('obshchak_token');A.error='';renderLogin();}
else if(act==='secret-close'){A.secret=null;render();}
else if(act==='copy-secret'){let s=A.secret;await navigator.clipboard.writeText('ОБЩАК\nЛогін: '+s.login+'\nТимчасовий пароль: '+s.password);toast('Скопійовано. Передавайте особисто.');}
else if(act==='reset'){if(!confirm('Створити новий тимчасовий пароль? Старий перестане діяти.'))return;let r=await request('resetPassword',{id:button.dataset.id});A.secret=r;render();}
else if(act==='toggle'){if(!confirm('Змінити стан доступу учасника?'))return;await handler('toggleUser',{id:button.dataset.id},'Доступ оновлено.');}
else if(act==='report-filter'){A.reportFrom=$('#r-from').value;A.reportTo=$('#r-to').value;if(A.reportFrom>A.reportTo)throw new Error('Початок періоду пізніше за кінець');render();}
else if(act==='pdf'){let from=$('#r-from').value,to=$('#r-to').value;if(from>to)throw new Error('Неправильний період');toast('Формуємо PDF…');let r=await invoke('pdf',{from,to}),url=saveBlob(r),a=document.createElement('a');a.href=url;a.download=r.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF сформовано.');}
else if(act==='support-election')await handler('supportElection',{id:button.dataset.id},'Ініціативу підтримано.');
else if(act==='vote'){if(!confirm('Підтвердити голос? Змінити його не можна.'))return;await handler('castVote',{id:button.dataset.id,vote:button.dataset.vote},'Голос зараховано.');}
else if(act==='accept-election'){if(!confirm('Прийняти повноваження касира? Фактична передача грошей потребує окремої звірки.'))return;await handler('acceptElection',{id:button.dataset.id},'Посаду касира прийнято. Увійдіть повторно.');}
else if(act==='password'){A.state=null;renderLogin(true);}
}catch(err){toast(err.message,true);}
});
document.addEventListener('change',ev=>{if(ev.target.id==='filter'){A.filter=ev.target.value;render();}if(ev.target.id==='person-select'){let x=$('#otherperson');if(x)x.style.display=ev.target.value==='OTHER'?'block':'none';}});
setInterval(()=>{if(A.token&&A.state&&!A.selected&&!A.preview&&!A.secret&&!document.querySelector('#add-transaction, input:focus,textarea:focus,select:focus'))load();},60000);
if(A.token)load();else renderLogin();
</script></body></html>
