name: Build test Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        env:
          OBSHCHAK_SCRIPT_URL: ${{ secrets.OBSHCHAK_SCRIPT_URL }}
        run: |
          if [ -z "$OBSHCHAK_SCRIPT_URL" ]; then
            echo "::error::Set repository Actions secret OBSHCHAK_SCRIPT_URL to your Apps Script /exec deployment URL."
            exit 1
          fi
          gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OBSHCHAK-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
